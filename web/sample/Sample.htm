<!doctype html>
<html>
<head>
<style>
body { margin: 24px; font-family: sans-serif; background: #fff; color: #222; }
h1 { color: #5645d4; }
.card { border: 1px solid #ddd; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
button { padding: 6px 12px; border-radius: 8px; border: 1px solid #5645d4; background: #fff; color: #5645d4; }
</style>
</head>
<body>
<h1>Spring concert</h1>
<div class="card"><p>Saturday 8 pm, Town Hall</p><p>Doors open at 7.30 pm.</p></div>
<div class="card"><p>Tickets left: <strong id="left">40</strong></p><button id="buy">Book a ticket</button></div>
<script>
document.getElementById('buy').addEventListener('click', () => {
  const left = document.getElementById('left')
  left.textContent = String(Math.max(0, Number(left.textContent) - 1))
})
</script>
</body>
</html>
