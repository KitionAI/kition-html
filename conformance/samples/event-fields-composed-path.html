<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>event-fields-composed-path</title><style>
@font-face{font-family:Inter;src:url(../assets/Inter-Variable.ttf);font-weight:100 900}
@font-face{font-family:Lora;src:url(../assets/Lora-Variable.ttf);font-weight:400 700}
@font-face{font-family:"JetBrains Mono";src:url(../assets/JetBrainsMono-Variable.ttf);font-weight:100 800}
html,body{margin:0;padding:0;background:white;color:#1a1a1a;font:16px/1.5 Inter}
#stage{box-sizing:border-box;width:100%;min-height:480px;padding:24px}
.box{width:160px;height:96px;background:#e5486a}.tile{display:inline-block;width:120px;height:80px;margin:0 12px 12px 0;vertical-align:top}

</style></head><body><main id="stage"><section id="parent"><div id="target" class="box"></div></section><script>const target=document.getElementById('target'),parent=document.getElementById('parent');function ready(condition){if(condition)target.style.background='#5645d4'}let valid=false;target.addEventListener('paint',event=>{const path=event.composedPath();valid=path[0]===target&&path[1]===parent&&path.at(-2)===document&&path.at(-1)===window});const event=new Event('paint',{bubbles:true});target.dispatchEvent(event);ready(valid&&event.composedPath().length===0);</script></main></body></html>
