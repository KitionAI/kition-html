<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>canvas-origin-lora-24-x</title><style>
@font-face{font-family:Inter;src:url(../assets/Inter-Variable.ttf);font-weight:100 900}
@font-face{font-family:Lora;src:url(../assets/Lora-Variable.ttf);font-weight:400 700}
@font-face{font-family:"JetBrains Mono";src:url(../assets/JetBrainsMono-Variable.ttf);font-weight:100 800}
html,body{margin:0;padding:0;background:white;color:#1a1a1a;font:16px/1.5 Inter}
#stage{box-sizing:border-box;width:100%;min-height:480px;padding:24px}
.box{width:160px;height:96px;background:#e5486a}.tile{display:inline-block;width:120px;height:80px;margin:0 12px 12px 0;vertical-align:top}

canvas{display:block}</style></head><body><main id="stage"><canvas id="canvas" width="592" height="320"></canvas><script>document.fonts.load('24px "Lora"').then(()=>{const ctx=document.getElementById('canvas').getContext('2d');ctx.font='24px "Lora"';ctx.fillStyle='#1a1a1a';for(let row=0;row<3;row++){ctx.fillStyle=['#000000','#1a1a1a','#5645d4'][row];for(let i=0;i<16;i++)ctx.fillText('Hg',16+i*35+i/16,60+row*88+0);}document.body.dataset.ready='true'})</script></main></body></html>
