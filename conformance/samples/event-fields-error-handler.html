<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>event-fields-error-handler</title><style>
@font-face{font-family:Inter;src:url(../assets/Inter-Variable.ttf);font-weight:100 900}
@font-face{font-family:Lora;src:url(../assets/Lora-Variable.ttf);font-weight:400 700}
@font-face{font-family:"JetBrains Mono";src:url(../assets/JetBrainsMono-Variable.ttf);font-weight:100 800}
html,body{margin:0;padding:0;background:white;color:#1a1a1a;font:16px/1.5 Inter}
#stage{box-sizing:border-box;width:100%;min-height:480px;padding:24px}
.box{width:160px;height:96px;background:#e5486a}.tile{display:inline-block;width:120px;height:80px;margin:0 12px 12px 0;vertical-align:top}

</style></head><body><main id="stage"><section id="parent"><div id="target" class="box"></div></section><script>const target=document.getElementById('target'),parent=document.getElementById('parent');function ready(condition){if(condition)target.style.background='#5645d4'}const reason=new Error('example'),event=new ErrorEvent('error',{message:'example',filename:'sample.js',lineno:7,colno:3,error:reason,cancelable:true});let valid=false;window.onerror=function(message,file,line,column,error){valid=this===window&&message==='example'&&file==='sample.js'&&line===7&&column===3&&error===reason;return true};ready(!window.dispatchEvent(event)&&valid&&event.defaultPrevented);</script></main></body></html>
