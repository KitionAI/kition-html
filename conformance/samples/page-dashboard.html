<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>page-dashboard</title><style>
@font-face{font-family:Inter;src:url(../assets/Inter-Variable.ttf);font-weight:100 900}
@font-face{font-family:Lora;src:url(../assets/Lora-Variable.ttf);font-weight:400 700}
@font-face{font-family:"JetBrains Mono";src:url(../assets/JetBrainsMono-Variable.ttf);font-weight:100 800}
html,body{margin:0;padding:0;background:white;color:#1a1a1a;font:16px/1.5 Inter}
#stage{box-sizing:border-box;width:100%;min-height:480px;padding:24px}
.box{width:160px;height:96px;background:#e5486a}.tile{display:inline-block;width:120px;height:80px;margin:0 12px 12px 0;vertical-align:top}


#stage{padding:20px;background:#f6f5f4;font-size:14px;line-height:1.45}
*{box-sizing:border-box}h1,h2,h3,p{margin:0}h1{font-size:26px;line-height:1.2;letter-spacing:-.6px}h2{font-size:18px;line-height:1.3}h3{font-size:14px}
.app{max-width:100%;margin:0 auto}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.brand{font-size:18px;font-weight:700;color:#5645d4}.muted{color:#787671}.eyebrow{font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:#787671}.subtitle{margin-top:6px;color:#787671}
.card{background:#fff;border:1px solid #e5e3df;border-radius:12px;padding:18px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.stack{display:flex;flex-direction:column;gap:12px}.row{display:flex;align-items:center;gap:12px}.space{justify-content:space-between}.section{margin-top:20px}.value{font-size:28px;font-weight:600;line-height:1.2;margin:8px 0}.positive{color:#1aae39;font-size:12px}.tag{display:inline-block;padding:3px 8px;background:#e6e0f5;color:#391c57;border-radius:4px;font-size:11px;font-weight:600}
button,.button{font:600 13px/1.3 Inter;padding:9px 14px;border:1px solid #e5e3df;background:#fff;border-radius:8px;color:#1a1a1a;text-decoration:none;display:inline-block}.primary{background:#5645d4;border-color:#5645d4;color:#fff}input,select{font:14px Inter;border:1px solid #c8c4be;border-radius:8px;padding:10px;background:#fff;color:#1a1a1a}label{font-size:13px;font-weight:500}.field{display:flex;flex-direction:column;gap:6px}.rule{height:1px;background:#e5e3df;margin:16px 0}
@media(max-width:480px){#stage{padding:14px}.grid{grid-template-columns:1fr}.two{grid-template-columns:1fr}.top{margin-bottom:18px}h1{font-size:23px}.card{padding:14px}.hide-small{display:none}}
.bars{height:112px;display:flex;align-items:flex-end;gap:18px;margin-top:18px}.bar{flex:1;background:#5645d4;border-radius:4px 4px 0 0}.days{font-size:11px;margin-top:8px}</style></head><body><main id="stage"><div class="app"><header class="top"><b class="brand">Kition</b><span class="muted">Workspace overview</span></header><h1>A productive week</h1><p class="subtitle">Everything your team is moving forward.</p><div class="grid section"><article class="card"><p class="muted">Documents</p><p class="value">128</p><span class="positive">+12 this week</span></article><article class="card"><p class="muted">Active projects</p><p class="value">24</p><span class="positive">4 ready to review</span></article><article class="card"><p class="muted">Tasks complete</p><p class="value">86%</p><span class="positive">+8% this week</span></article></div><section class="card section"><div class="row space"><h2>Activity</h2><span class="tag">Last 7 days</span></div><div class="bars"><div class="bar" style="height:35%"></div><div class="bar" style="height:60%"></div><div class="bar" style="height:45%"></div><div class="bar" style="height:80%"></div><div class="bar" style="height:65%"></div><div class="bar" style="height:95%"></div><div class="bar" style="height:78%"></div></div><div class="row space muted days"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div></section></div></main></body></html>
