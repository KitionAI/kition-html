<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>composite-canvas-rounded</title><style>
@font-face{font-family:Inter;src:url(../assets/Inter-Variable.ttf);font-weight:100 900}
@font-face{font-family:Lora;src:url(../assets/Lora-Variable.ttf);font-weight:400 700}
@font-face{font-family:"JetBrains Mono";src:url(../assets/JetBrainsMono-Variable.ttf);font-weight:100 800}
html,body{margin:0;padding:0;background:white;color:#1a1a1a;font:16px/1.5 Inter}
#stage{box-sizing:border-box;width:100%;min-height:480px;padding:24px}
.box{width:160px;height:96px;background:#e5486a}.tile{display:inline-block;width:120px;height:80px;margin:0 12px 12px 0;vertical-align:top}

canvas{display:block}</style></head><body><main id="stage"><canvas id="canvas" width="280" height="280"></canvas><script>const ctx=document.getElementById('canvas').getContext('2d'),colors=["#5645d4","#e5486a","#1f9d4c","#ffffff","#000000"],alphas=[0.1,0.25,0.5,0.75,0.9];for(let row=0;row<5;row++)for(let col=0;col<5;col++){const x=col*56,y=row*56,alpha=alphas[col],color=colors[row];ctx.globalAlpha=1;ctx.fillStyle=colors[(row+1)%5];ctx.fillRect(x,y,48,48);ctx.globalAlpha=alpha;ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,48,48,12);ctx.fill();}</script></main></body></html>
