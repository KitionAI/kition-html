</style></head><body><main id="stage"><section id="parent"><div id="target" class="box"></div></section><script>const target=document.getElementById('target'),parent=document.getElementById('parent');function ready(condition){if(condition)target.style.background='#5645d4'}const event=new Event('paint',{bubbles:true,cancelable:false,composed:true});event.bubbles=false;event.cancelable=true;event.composed=false;event.preventDefault();ready(event.bubbles&&!event.cancelable&&event.composed&&!event.defaultPrevented);</script></main></body></html>
