</style></head><body><main id="stage"><div id="target" class="box"></div><script>const target=document.getElementById('target');function ready(condition){if(condition)target.style.background='#5645d4';document.body.dataset.ready='true'}const controller=new AbortController(),reason={code:7};controller.abort(reason);let thrown=false;try{controller.signal.throwIfAborted()}catch(error){thrown=error===reason}ready(thrown&&controller.signal.reason===reason);</script></main></body></html>
