<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>select-state-transfer</title><style>
@font-face{font-family:Inter;src:url(../assets/Inter-Variable.ttf);font-weight:100 900}
@font-face{font-family:Lora;src:url(../assets/Lora-Variable.ttf);font-weight:400 700}
@font-face{font-family:"JetBrains Mono";src:url(../assets/JetBrainsMono-Variable.ttf);font-weight:100 800}
html,body{margin:0;padding:0;background:white;color:#1a1a1a;font:16px/1.5 Inter}
#stage{box-sizing:border-box;width:100%;min-height:480px;padding:24px}
.box{width:160px;height:96px;background:#e5486a}.tile{display:inline-block;width:120px;height:80px;margin:0 12px 12px 0;vertical-align:top}

select{display:none}pre{margin:0;font:12px/20px "JetBrains Mono";white-space:pre-wrap;color:#1a1a1a}</style></head><body><main id="stage"><select id=s><option id=a value=a>A</option><option id=b value=b>B</option><option id=c value=c>C</option></select><select id=t><option value=x>X</option></select><pre id="result"></pre><script>const s=document.getElementById('s'),a=document.getElementById('a'),b=document.getElementById('b'),c=document.getElementById('c'),trace=[];const snap=()=>trace.push({index:s.selectedIndex,value:s.value,states:[...s.querySelectorAll('option')].map(o=>[o.value,o.selected,o.defaultSelected])});snap();const t=document.getElementById('t');t.appendChild(a);snap();trace.push({other:t.value,detached:a.selected});document.getElementById('result').textContent=trace.map(step=>JSON.stringify(step)).join('\n');</script></main></body></html>
