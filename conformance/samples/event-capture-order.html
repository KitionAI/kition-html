<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>event-capture-order</title><style>
@font-face{font-family:Inter;src:url(../assets/Inter-Variable.ttf);font-weight:100 900}
@font-face{font-family:Lora;src:url(../assets/Lora-Variable.ttf);font-weight:400 700}
@font-face{font-family:"JetBrains Mono";src:url(../assets/JetBrainsMono-Variable.ttf);font-weight:100 800}
html,body{margin:0;padding:0;background:white;color:#1a1a1a;font:16px/1.5 Inter}
#stage{box-sizing:border-box;width:100%;min-height:480px;padding:24px}
.box{width:160px;height:96px;background:#e5486a}.tile{display:inline-block;width:120px;height:80px;margin:0 12px 12px 0;vertical-align:top}

</style></head><body><main id="stage"><section id="parent"><div id="target" class="box"></div></section><script>const order=[];const parent=document.getElementById('parent'),target=document.getElementById('target');parent.addEventListener('paint',()=>order.push('capture'),true);parent.addEventListener('paint',()=>order.push('bubble'));target.addEventListener('paint',()=>order.push('target'));target.dispatchEvent(new Event('paint',{bubbles:true}));if(order.join(',')==='capture,target,bubble'){document.getElementById('target').style.background='#5645d4'}</script></main></body></html>
