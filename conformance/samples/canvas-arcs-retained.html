canvas{display:block}</style></head><body><main id="stage"><canvas id="canvas" width="320" height="200"></canvas><script>const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');ctx.fillStyle='#5645d4';ctx.strokeStyle='#5645d4';ctx.lineWidth=8;const path=new Path2D();path.moveTo(20,20);path.arcTo(240,20,240,160,40);path.lineTo(240,160);ctx.stroke(path);</script></main></body></html>
