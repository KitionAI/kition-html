<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>table-empty-cells</title><style>
@font-face{font-family:Inter;src:url(../assets/Inter-Variable.ttf);font-weight:100 900;font-style:normal}
