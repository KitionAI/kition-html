name: Package

# Builds this kit's package on GitHub and publishes it on npm (@kition/kit-html-ui and
# @kition/kit-html-<platform>), with Kition's reusable workflow (KitionAI/kition,
# .github/workflows/kit-package.yml; docs/kits.md, section 4b, there). Start it by hand:
# gh workflow run package.yml
# A version is published once: bump `version` in kit.json to publish a change.

on:
  workflow_dispatch:
    inputs:
      scope:
        description: The npm scope to publish to (another scope than @kition is a rehearsal, with the secret NPM_TOKEN_STAGE)
        required: false
        default: '@kition'
        type: string
      platforms:
        description: Only these platforms (separated by commas); empty for every platform
        required: false
        default: ''
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  package:
    uses: KitionAI/kition/.github/workflows/kit-package.yml@main
    with:
      kit: html
      scope: ${{ inputs.scope }}
      platforms: ${{ inputs.platforms }}
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      NPM_TOKEN_STAGE: ${{ secrets.NPM_TOKEN_STAGE }}
