[package]
name = "stylo"
version = "0.22.0"
authors = ["The Servo Project Developers"]
license = "MPL-2.0"
repository = "https://github.com/servo/stylo"
edition = "2024"
description = "The Stylo CSS engine"
readme = "README.md"

build = "build.rs"

# https://github.com/rust-lang/cargo/issues/3544
links = "servo_style_crate"

[lib]
name = "style"
path = "lib.rs"
doctest = false

[features]
default = ["servo"]
gecko = [
    "bindgen",
    "malloc_size_of/gecko",
    "mozbuild",
    "nsstring",
    "regex",
    "serde",
    "style_traits/gecko",
    "toml",
    "selectors/to_shmem",
    "to_shmem/gecko",
]
servo = [
    "cssparser/serde",
    "encoding_rs",
    "malloc_size_of/servo",
    "web_atoms",
    "mime",
    "serde",
    "servo_arc/servo",
    "stylo_atoms",
    "string_cache",
    "style_traits/servo",
    "url",
    "selectors/to_shmem",
    "to_shmem/servo",
]
gecko_debug = []
gecko_refcount_logging = []
nsstring = []

[dependencies]
app_units = "0.7.8"
arrayvec = "0.7"
atomic_refcell = "0.1"
bitflags = "2"
byteorder = "1.0"
cssparser = "0.38"
derive_more = { version = "2", features = ["add", "add_assign", "deref", "deref_mut", "from"] }
dom = { version = "0.22.0", package = "stylo_dom", git = "https://github.com/DioxusLabs/stylo", rev = "d6502e0002e9c40c43a0a4776f9e7eb93be360e3" }
new_debug_unreachable = "1.0"
encoding_rs = {version = "0.8", optional = true}
euclid = "0.22"
rustc-hash = "2.1.1"
hashbrown = "0.17"
icu_segmenter = { version = ">= 1.5, <= 2.*", default-features = false, features = ["auto", "compiled_data"] }
indexmap = {version = "2", features = ["std"]}
itertools = "0.14"
itoa = "1.0"
log = "0.4"
malloc_size_of = { version = "0.22.0", package = "stylo_malloc_size_of", features = ["servo"], git = "https://github.com/DioxusLabs/stylo", rev = "d6502e0002e9c40c43a0a4776f9e7eb93be360e3" }
malloc_size_of_derive = "0.1"
mozbuild = {version = "0.1", optional = true}
web_atoms = { version = "0.3.0", optional = true }
mime = { version = "0.3.13", optional = true }
num_cpus = {version = "1.1.0"}
num-integer = "0.1"
num-traits = "0.2"
num-derive = "0.4"
parking_lot = "0.12"
precomputed-hash = "0.1.1"
rand = { version = "0.8.6", default-features = false, features = ["small_rng"] }
rayon = "1"
rayon-core = "1"
selectors = { version = "0.41.0", git = "https://github.com/DioxusLabs/stylo", rev = "d6502e0002e9c40c43a0a4776f9e7eb93be360e3" }
serde = {version = "1.0", optional = true, features = ["derive"]}
servo_arc = { version = "0.5.0", git = "https://github.com/DioxusLabs/stylo", rev = "d6502e0002e9c40c43a0a4776f9e7eb93be360e3" }
stylo_atoms = { version = "0.22.0", git = "https://github.com/DioxusLabs/stylo", rev = "d6502e0002e9c40c43a0a4776f9e7eb93be360e3", optional = true }
smallbitvec = "2.3.0"
smallvec = "1.0"
static_assertions = "1.1"
static_prefs = { version = "0.22.0", package = "stylo_static_prefs", git = "https://github.com/DioxusLabs/stylo", rev = "d6502e0002e9c40c43a0a4776f9e7eb93be360e3" }
string_cache = { version = "0.11", optional = true }
strum = "0.28"
strum_macros = "0.28"
style_derive = { version = "0.22.0", package = "stylo_derive", git = "https://github.com/DioxusLabs/stylo", rev = "d6502e0002e9c40c43a0a4776f9e7eb93be360e3" }
style_traits = { version = "0.22.0", features = ["servo"], package = "stylo_traits", git = "https://github.com/DioxusLabs/stylo", rev = "d6502e0002e9c40c43a0a4776f9e7eb93be360e3" }
to_shmem = { version = "0.6.0", features = ["servo"], git = "https://github.com/DioxusLabs/stylo", rev = "d6502e0002e9c40c43a0a4776f9e7eb93be360e3" }
to_shmem_derive = { version = "0.2.0", git = "https://github.com/DioxusLabs/stylo", rev = "d6502e0002e9c40c43a0a4776f9e7eb93be360e3" }
thin-vec = { version = "0.2.1", features = ["serde"] }
uluru = "3.0"
void = "1.0.2"
url = { version = "2.5", optional = true, features = ["serde"] }

[build-dependencies]
log = { version = "0.4", features = ["std"] }
bindgen = {version = "0.73", optional = true, default-features = false}
regex = {version = "1.0", optional = true, default-features = false, features = ["perf", "std"]}
walkdir = "2.1.4"
toml = {version = "0.5", optional = true, default-features = false}
mozbuild = {version = "0.1", optional = true}

[workspace]
