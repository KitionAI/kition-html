format: 1
id: html.agent.act/headline-colour
feature: html.agent.act
intent: >-
  The agent edits the stylesheet in the page source to recolour the headline, keeping the card's style and every word of the page.
layer: eval
source:
  kind: synthetic
  from: repo:conformance/basic.html
  license: Apache-2.0
  note: "A copy of the conformance page: a purple h1 \"Spring concert\" and a card with \"Saturday 8 pm, Town Hall\"."
input: [input/concert.html]
steps:
  - task:
      prompt: >-
        In concert.html, change the headline's colour to #0a7d4a. Change nothing else.
      max_turns: 20
  - file: { path: concert.html, as: page }
expected:
  - actual: out:page
    compare: text
    value:
      matches: ['h1\s*\{[^}]*color:\s*#0a7d4a']
      absent: ["#5645d4"]
  - actual: out:page
    compare: text
    collateral: true
    value:
      contains: ["<h1>Spring concert</h1>", "Saturday 8 pm, Town Hall", "border-radius:12px"]
solution:
  - tool: html_run
    args: { path: concert.html, steps: [{ command: html.setSource, params: { source: "<!doctype html>\n<html><head><style>body{margin:24px;font-family:sans-serif;background:#fff}h1{color:#0a7d4a}.card{border:1px solid #ddd;border-radius:12px;padding:16px}</style></head>\n<body><h1>Spring concert</h1><div class=\"card\"><p>Saturday 8 pm, Town Hall</p></div></body></html>\n" } }] }
since: "2026-11-16"
timeout_s: 600
