format: 1
id: regressions/issue-2
feature: html.render.fonts
intent: >-
  SVG <text> draws with the page's fonts (the bundled Inter, its font resources and the fonts the
  host added), never the machine's: a family the page lacks (Helvetica, Times New Roman) and the
  generic families without a face of their own draw in Inter, an added face draws by its name, and
  serif is the serif face the host added. Before, usvg's font database loaded the system fonts, so
  renders differed between machines and font-family named only system faces.
layer: gate
