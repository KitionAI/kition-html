format: 1
id: regressions/issue-headless-features
feature: html.collab.replica
intent: >-
  kit.json's headless.features lists exactly what the headless executable's kit.initialize answers
  (platform rule K9), and those features work on a page: model.open, model.import, model.export,
  model.save, model.describe and model.batch. Before, the executable served all six but kit.json
  listed only view.describe and document.check, so a host could not know them before starting it.
layer: gate
source:
  kind: probe
  from: "kit-probe on kition-html --kition-kit: kit.initialize listed eight features, kit.json two"
  license: Apache-2.0
input: []
steps:
  - cargo-test: { package: "kition-html", test: "headless" }
expected:
  - actual: out:exit
    compare: exit
since: "2026-11-16"
