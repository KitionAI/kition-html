id: regressions/issue-unknown-params
feature: html.agent.recover
intent: >-
  A command refuses a key its schema does not name and says which, with the parameter it resembles
  and the ones the command takes (platform rule E7a), instead of running without it. Before, undo
  and redo ran with an unknown key, and the other commands refused one only by complaining about
  a key they need.
