format: 1
id: html.agent.recover/missing-image
feature: html.agent.recover
intent: >-
  The agent runs the kit's check, sees the page asks for an image that is not there, and repairs the page (removing the reference; it cannot invent the file), keeping all of the text (KHP Verify).
layer: eval
source:
  kind: synthetic
  from: repo:conformance/check-resource-unavailable.html
  license: Apache-2.0
  note: "A copy of the conformance fixture for html.resource-unavailable: the basic page plus an <img> of images/poster.png, a file that does not exist."
input: [input/concert.html]
steps:
  - task:
      prompt: >-
        Run the kit's check on concert.html and fix every error it reports. Keep all of the page's
        text.
      max_turns: 20
  - check: { path: concert.html, as: diagnostics }
  - file: { path: concert.html, as: page }
expected:
  - actual: out:diagnostics
    compare: diagnostics
    value: { absent: [html.resource-unavailable], max_errors: 0 }
  - actual: out:page
    compare: text
    collateral: true
    value:
      contains: ["<h1>Spring concert</h1>", "Saturday 8 pm, Town Hall", "border-radius:12px"]
solution:
  - tool: html_run
    args: { path: concert.html, steps: [{ command: file.setSource, params: { source: "<!doctype html>\n<html><head><style>body{margin:24px;font-family:sans-serif;background:#fff}h1{color:#5645d4}.card{border:1px solid #ddd;border-radius:12px;padding:16px}</style></head>\n<body><h1>Spring concert</h1><div class=\"card\"><p>Saturday 8 pm, Town Hall</p></div></body></html>\n" } }] }
since: "2026-11-16"
timeout_s: 600
